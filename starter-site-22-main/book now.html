<section class="waitlist-section">
    <div class="waitlist-container">
        <h2 class="form-title">Join Our Cabin Waitlist!</h2>
        <p>Our cabins and campgrounds fill up quickly. Enter your details below to secure your spot in line for upcoming openings.</p>
        
        <!-- Form Element -->
        <form id="waitlistForm" action="./submitted.html" method="GET">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Your Name" required>
            </div>
            
            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="(555) 555-5555" required>
            </div>
            
            <div class="form-group">
                <label for="emailAddress">Email Address</label>
                <input type="email" id="emailAddress" name="emailAddress" placeholder="yourname@example.com" required>
            </div>
            
            <button type="submit" class="submit-btn">Secure My Spot</button>
      
        </form>
    </div>
</section>
